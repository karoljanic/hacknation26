# Verified-disinformation database (collector euvsdisinfo; needs
# EUVSDISINFO_API_KEY; params: tools, page_size, max_records)
# --------------------------------------------------------------------------- #

[[source]]
slug = "euvsdisinfo"
name = "EUvsDisinfo"
publisher = "East StratCom Task Force, Europejska Służba Działań Zewnętrznych (EEAS)"
kind = "fact_checker"
domain = "euvsdisinfo.eu"
tier = 2
license = "Baza EUvsDisinfo przez oficjalny serwer MCP; warunki ponownego wykorzystania do potwierdzenia; przechowywane: streszczenie przypadku, analiza, link."
inclusion_rule = "Baza przypadków prokremlowskiej dezinformacji prowadzona przez instytucję UE; dotyczy FIMI (zakres zadania)."
homepage_url = "https://euvsdisinfo.eu"
lang = "en"
[source.collect]
collector = "euvsdisinfo"
tools = ["cases", "articles"]
page_size = 50
max_records = 100
