# Prawdowid source catalogue — the auditable list of sources the system may cite.
#
# Synced into the `source` table by `python -m prawdowid.ingestion sync-catalog`
# (also done automatically before `ingest`). Rules:
#   * qualification: every entry states its `inclusion_rule`; only official
#     publishers (kind=official, tier 1), public data (public_data, tier 1) and
#     fact-checkers / verified-information databases (fact_checker, tier 2)
#     are listed, plus the Polish Wikipedia (media, tier 3) for established
#     general knowledge only — it loses to tier 1-2 sources when they disagree;
#   * update: each `ingest` run re-collects the source; unchanged pages are
#     recognised by content hash, changed pages are stored as a new version;
#     every run is logged in `ingestion_run`;
#   * exclusion: removing an entry marks the source inactive (its documents are
#     kept for the audit trail but no longer collected);
#   * a source's status (e.g. EU sanctions) goes in `status_warning` and is
#     shown as a neutral note — it never decides a verdict by itself.
#
# Fields: slug, name, publisher, kind (official|public_data|fact_checker|media),
# domain (bare host), tier (1-3), license, inclusion_rule, homepage_url,
# status_warning, lang, and [source.collect] = collector name + its parameters.
# "do potwierdzenia" marks facts to verify at the next catalogue review.

# --------------------------------------------------------------------------- #
# Official: gov.pl (collector gov_pl; params: listing_urls, static_urls, limit)
# --------------------------------------------------------------------------- #

[[source]]
slug = "gov-rcb"
name = "Rządowe Centrum Bezpieczeństwa"
publisher = "Rządowe Centrum Bezpieczeństwa"
kind = "official"
domain = "gov.pl"
tier = 1
license = "Dokumenty i materiały urzędowe — wyłączone z ochrony prawa autorskiego (art. 4 ustawy o prawie autorskim); pozostałe treści wg warunków serwisu gov.pl (do potwierdzenia)."
inclusion_rule = "Organ administracji rządowej odpowiedzialny za zarządzanie kryzysowe; źródło pierwotne ostrzeżeń i raportów dobowych."
homepage_url = "https://www.gov.pl/web/rcb"
[source.collect]
collector = "gov_pl"
limit = 8
listing_urls = [
  "https://www.gov.pl/web/rcb/raport-dobowy3",
  "https://www.gov.pl/web/rcb/strona-glowna-rzadowego-centrum-bezpieczenstwa",
]

