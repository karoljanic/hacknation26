name: prawdowid

x-worker: &worker
  build:
    context: ../apps/backend
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    FACTCHECK_API_KEY: ${FACTCHECK_API_KEY:-}
    EUVSDISINFO_API_KEY: ${EUVSDISINFO_API_KEY:-}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PRAWDOWID_CATALOG: /app/data/sources/catalog.toml
  volumes:
    # Source catalogue lives outside the backend build context; read-only.
    - ../data/sources:/app/data/sources:ro
  depends_on:
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    # Postgres 17 with the pgvector extension (embeddings for passages/claims).
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      # Run as the rabbitmq user: run as root, the CLI creates a root-owned
      # ~/.erlang.cookie if it runs before the server (Podman runs the first
      # check immediately), and the server then fails with "eacces".
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: applies Alembic migrations, then syncs the auditable source
  # catalogue (data/sources/catalog.toml, mounted read-only) before the API
  # and workers start.
  migrate:
    build:
      context: ../apps/backend
    command: ["sh", "-c", "alembic upgrade head && python -m prawdowid.ingestion sync-catalog"]
    environment:
      DATABASE_URL: &database_url postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRAWDOWID_CATALOG: /app/data/sources/catalog.toml
    volumes:
      - ../data/sources:/app/data/sources:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../apps/backend
    environment:
      DATABASE_URL: *database_url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      FACTCHECK_API_KEY: ${FACTCHECK_API_KEY:-}
      EUVSDISINFO_API_KEY: ${EUVSDISINFO_API_KEY:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-http://127.0.0.1:8000/auth/x/callback}
      PRAWDOWID_CATALOG: /app/data/sources/catalog.toml
      GEMINI_PREPARATION_MODEL: ${GEMINI_PREPARATION_MODEL:-}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-}
      GEMINI_ASSESSMENT_MODEL: ${GEMINI_ASSESSMENT_MODEL:-}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-LOW}
      # Optional per-check cost estimate (see README, "Zapis zgłoszeń i tez").
      MODEL_PRICES_USD_PER_MTOK: ${MODEL_PRICES_USD_PER_MTOK:-}
      # Request limits for POST /check (see README, "Limity żądań").
      CHECK_RATE_LIMIT_PER_MINUTE: ${CHECK_RATE_LIMIT_PER_MINUTE:-20}
      CHECK_RATE_LIMIT_PER_DAY: ${CHECK_RATE_LIMIT_PER_DAY:-300}
      CHECK_GLOBAL_LIMIT_PER_DAY: ${CHECK_GLOBAL_LIMIT_PER_DAY:-5000}
      CHECK_MAX_CONCURRENT: ${CHECK_MAX_CONCURRENT:-8}
      CHECK_TRUST_FORWARDED_FOR: ${CHECK_TRUST_FORWARDED_FOR:-}
      PRAWDOWID_SIGNING_KEY: ${PRAWDOWID_SIGNING_KEY:-}
    command: ["uvicorn", "prawdowid.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - x_auth_data:/home/app/.local/share/prawdowid
      - ../data/sources:/app/data/sources:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      context: ../apps/web
    environment:
      # Used server-side by the web app's /api/check proxy route.
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  worker-fetch:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "fetch", "--concurrency=1", "--hostname=fetch@%h"]

  worker-claims:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "claims", "--concurrency=1", "--hostname=claims@%h"]

  worker-search:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "search", "--concurrency=1", "--hostname=search@%h"]

  worker-evidence:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "evidence", "--concurrency=1", "--hostname=evidence@%h"]

  worker-aggregate:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "aggregate", "--concurrency=1", "--hostname=aggregate@%h"]

  worker-ingestion:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "ingestion", "--concurrency=1", "--hostname=ingestion@%h"]

  worker-embedding:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "embedding", "--concurrency=1", "--hostname=embedding@%h"]

volumes:
  postgres_data:
  x_auth_data:
