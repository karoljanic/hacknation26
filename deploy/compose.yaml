name: prawdowid

# All backend services run one image, built once by `migrate`. Every backend
# service depends on `migrate`, so the build is always part of `up`.
x-backend-image: &backend_image
  image: prawdowid-backend:dev
  pull_policy: never

x-worker: &worker
  <<: *backend_image
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    # Postgres 17 with the pgvector extension (embeddings for passages/claims).
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Poll every second while starting, so dependants start as soon as it is up.
      start_period: 30s
      start_interval: 1s

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 2s

  # One-shot: applies Alembic migrations before the API and workers start.
  migrate:
    build:
      context: ../apps/backend
    image: prawdowid-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: &database_url postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend_image
    environment:
      DATABASE_URL: *database_url
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      context: ../apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  worker-fetch:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "fetch", "--concurrency=1", "--hostname=fetch@%h"]

  worker-claims:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "claims", "--concurrency=1", "--hostname=claims@%h"]

  worker-search:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "search", "--concurrency=1", "--hostname=search@%h"]

  worker-evidence:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "evidence", "--concurrency=1", "--hostname=evidence@%h"]

  worker-aggregate:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "aggregate", "--concurrency=1", "--hostname=aggregate@%h"]

  worker-ingestion:
    <<: *worker
    command: ["celery", "-A", "prawdowid.workers.celery_app", "worker", "-Q", "ingestion", "--concurrency=1", "--hostname=ingestion@%h"]

volumes:
  postgres_data:
